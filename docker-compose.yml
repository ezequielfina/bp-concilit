x-airflow-common: &airflow-common
  image: concilit-airflow-custom:latest

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}/${POSTGRES_DB}

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    AIRFLOW__API__AUTH_BACKENDS: >
      airflow.api.auth.backend.basic_auth,
      airflow.api.auth.backend.session

    AIRFLOW_UID: "${AIRFLOW_UID:-50000}"

    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_HOST: ${POSTGRES_HOST}
    POSTGRES_PORT: ${POSTGRES_PORT}
    POSTGRES_DB: ${POSTGRES_DB}

    URI_DB: ${URI_DB}

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./data:/data

  user: "${AIRFLOW_UID:-50000}:0"

services:
  postgres:
    image: postgres:17

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      retries: 5

  fastapi-app:
    build:
      context: ./fastapi
      dockerfile: Dockerfile

    ports:
      - "${FASTAPI_PORT}:8000"

    volumes:
      - ./fastapi:/app
      - ./data:/data

    environment:
      AIRFLOW_API_URL: ${AIRFLOW_API_URL}
      AUTH_USER_AIRFLOW: ${AUTH_USER_AIRFLOW}
      AUTH_PASSWORD_AIRFLOW: ${AUTH_PASSWORD_AIRFLOW}
      DAG_ID_BUILD_REPORT: ${DAG_ID_BUILD_REPORT}
      DAG_ID_INIT_DATA: ${DAG_ID_INIT_DATA}

      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}

    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000

    depends_on:
      - airflow-webserver

  airflow-init:
    <<: *airflow-common

    command:
      - bash
      - -c
      - |
        airflow db migrate

        airflow users create \
          --username ${AUTH_USER_AIRFLOW} \
          --password ${AUTH_PASSWORD_AIRFLOW} \
          --firstname Admin \
          --lastname Admin \
          --role Admin \
          --email admin@example.com

  airflow-webserver:
    <<: *airflow-common

    command: webserver

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    ports:
      - "${AIRFLOW_PORT}:8080"

    restart: always

  airflow-scheduler:
    <<: *airflow-common

    command: scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    restart: always

volumes:
  postgres-db-volume: