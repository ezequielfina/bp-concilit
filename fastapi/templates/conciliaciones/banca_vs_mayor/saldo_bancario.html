{% extends "conciliaciones/banca_vs_mayor/sub_module.html" %}

{% block submodule_content %}

<div class="max-w-7xl mx-auto mt-10 grid grid-cols-1 lg:grid-cols-2 gap-8">

    <section class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
        <div class="flex items-center space-x-3 mb-6">
            <div class="p-2 bg-blue-100 text-blue-600 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                </svg>
            </div>
            <h2 class="text-xl font-bold text-gray-800">Nuevo saldo bancario</h2>
        </div>

        <form id="form-nuevo-saldo" class="space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="flex flex-col">
                    <label class="text-xs font-semibold text-gray-500 uppercase mb-1">Empresa</label>
                    <select id="crear-empresa-id" required class="border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        <option value="" disabled selected>Seleccioná...</option>
                        {% for empresa in empresas %}
                            <option value="{{ empresa.id }}">{{ empresa.razon_social }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="flex flex-col">
                    <label class="text-xs font-semibold text-gray-500 uppercase mb-1">Cuenta</label>
                    <select id="crear-cuenta-id" name="id_cuenta" required class="border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        <option value="" disabled selected>Primero elegí empresa</option>
                    </select>
                </div>
            </div>

            <div class="flex flex-col">
                <label class="text-xs font-semibold text-gray-500 uppercase mb-1">Fecha de corte</label>
                <input type="date" id="crear-fecha" name="fecha" required class="border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" />
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="flex flex-col">
                    <label class="text-xs font-semibold text-gray-500 uppercase mb-1">Saldo ARS</label>
                    <input type="number" step="0.01" id="crear-saldo-ars" name="saldo_ars" placeholder="0.00" required class="border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" />
                </div>
                <div class="flex flex-col">
                    <label class="text-xs font-semibold text-gray-500 uppercase mb-1">Saldo USD</label>
                    <input type="number" step="0.01" id="crear-saldo-usd" name="saldo_usd" placeholder="0.00" required class="border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" />
                </div>
            </div>

            <button type="submit" id="btn-crear" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-all duration-300 shadow-md flex items-center justify-center">
                <span>Guardar Nuevo Saldo</span>
            </button>
        </form>
    </section>

    <section class="bg-gray-50 p-8 rounded-2xl shadow-sm border border-dashed border-gray-300">
        <div class="flex items-center space-x-3 mb-6">
            <div class="p-2 bg-indigo-100 text-indigo-600 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
            </div>
            <h2 class="text-xl font-bold text-gray-800">Ver / Actualizar existente</h2>
        </div>

        <div class="bg-white p-6 rounded-xl border border-gray-200 mb-6 space-y-4">
            <div class="grid grid-cols-1 gap-4">
                <div class="flex flex-col">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-1">1. Empresa</label>
                    <select id="ver-empresa-id" class="border border-gray-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                        <option value="" disabled selected>Seleccioná empresa</option>
                        {% for empresa in empresas %}
                            <option value="{{ empresa.id }}">{{ empresa.razon_social }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="flex flex-col">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-1">2. Cuenta</label>
                    <select id="ver-cuenta-id" class="border border-gray-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                        <option value="" disabled selected>Esperando empresa...</option>
                    </select>
                </div>
                <div class="flex flex-col">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-1 text-indigo-600">3. Seleccionar Fecha de Saldo</label>
                    <select id="ver-saldo-id" class="border-2 border-indigo-100 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all bg-indigo-50">
                        <option value="" disabled selected>Esperando cuenta...</option>
                    </select>
                </div>
            </div>
        </div>

        <form id="form-update-saldo" class="space-y-5 opacity-40 pointer-events-none transition-all duration-500">
            <div class="grid grid-cols-2 gap-4">
                <div class="flex flex-col">
                    <label class="text-xs font-semibold text-gray-500 uppercase mb-1">Saldo ARS Registrado</label>
                    <input type="number" step="0.01" id="update-saldo-ars" class="border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none bg-white" />
                </div>
                <div class="flex flex-col">
                    <label class="text-xs font-semibold text-gray-500 uppercase mb-1">Saldo USD Registrado</label>
                    <input type="number" step="0.01" id="update-saldo-usd" class="border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none bg-white" />
                </div>
            </div>

            <button type="button" id="btn-update" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-md">
                Actualizar Registro
            </button>
        </form>
    </section>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // --- ELEMENTOS ---
    const btnCrear = document.getElementById('btn-crear');
    const formCrear = document.getElementById('form-nuevo-saldo');

    const verEmpresa = document.getElementById('ver-empresa-id');
    const verCuenta = document.getElementById('ver-cuenta-id');
    const verSaldo = document.getElementById('ver-saldo-id');
    const formUpdate = document.getElementById('form-update-saldo');
    const btnUpdate = document.getElementById('btn-update'); // Elemento para actualizar

    // 1. CARGA DE CUENTAS (Reutilizable)
    async function fetchCuentas(empresaId, selectElement) {
        selectElement.innerHTML = '<option value="" disabled selected>Cargando...</option>';
        const res = await fetch(`/api_v1/cuentas?id_empresa=${empresaId}`);
        const data = await res.json();
        selectElement.innerHTML = '<option value="" disabled selected>Seleccioná cuenta...</option>';
        data.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = c.nombre;
            selectElement.appendChild(opt);
        });
    }

    // 2. CARGA DE SALDOS
    async function fetchSaldos(cuentaId) {
        verSaldo.innerHTML = '<option value="" disabled selected>Cargando fechas...</option>';
        const res = await fetch(`/api_v1/saldos_bancarios/cuenta/${cuentaId}`);
        const saldos = await res.json();

        verSaldo.innerHTML = '<option value="" disabled selected>Seleccioná una fecha...</option>';
        if (saldos.length === 0) {
            verSaldo.innerHTML = '<option value="" disabled>Sin saldos históricos</option>';
            formUpdate.classList.add('opacity-40', 'pointer-events-none');
            return;
        }

        saldos.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            // Guardamos los valores en dataset para no tener que volver a pedirlos al servidor
            opt.textContent = `${s.fecha} (ARS: ${s.saldo_ars})`;
            opt.dataset.ars = s.saldo_ars;
            opt.dataset.usd = s.saldo_usd;
            verSaldo.appendChild(opt);
        });
    }

    // EVENTOS DE NAVEGACIÓN
    document.getElementById('crear-empresa-id').addEventListener('change', (e) => fetchCuentas(e.target.value, document.getElementById('crear-cuenta-id')));
    verEmpresa.addEventListener('change', (e) => fetchCuentas(e.target.value, verCuenta));
    verCuenta.addEventListener('change', (e) => fetchSaldos(e.target.value));

    // CARGAR DATA DEL SALDO SELECCIONADO AL FORMULARIO
    verSaldo.addEventListener('change', function() {
        const selectedOption = this.options[this.selectedIndex];
        document.getElementById('update-saldo-ars').value = selectedOption.dataset.ars;
        document.getElementById('update-saldo-usd').value = selectedOption.dataset.usd;
        formUpdate.classList.remove('opacity-40', 'pointer-events-none');
    });

    // 3. LÓGICA DE CREACIÓN (POST)
    formCrear.addEventListener('submit', async (e) => {
        e.preventDefault();
        const originalText = btnCrear.innerHTML;
        const data = {
            id_cuenta: document.getElementById('crear-cuenta-id').value,
            fecha: document.getElementById('crear-fecha').value,
            saldo_ars: parseFloat(document.getElementById('crear-saldo-ars').value),
            saldo_usd: parseFloat(document.getElementById('crear-saldo-usd').value)
        };

        try {
            const res = await fetch('/api_v1/saldos_bancarios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                btnCrear.classList.replace('bg-blue-600', 'bg-green-500');
                btnCrear.innerHTML = '¡Guardado!';
                formCrear.reset();
                setTimeout(() => {
                    btnCrear.classList.replace('bg-green-500', 'bg-blue-600');
                    btnCrear.innerHTML = originalText;
                }, 3000);
            }
        } catch (e) { console.error(e); }
    });

    // 4. LÓGICA DE ACTUALIZACIÓN (PUT)
    btnUpdate.addEventListener('click', async () => {
        const saldoId = verSaldo.value;
        if (!saldoId) return;

        const originalText = btnUpdate.innerText;
        const updateData = {
            saldo_ars: parseFloat(document.getElementById('update-saldo-ars').value),
            saldo_usd: parseFloat(document.getElementById('update-saldo-usd').value)
        };

        try {
            const res = await fetch(`/api_v1/saldos_bancarios/${saldoId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updateData)
            });

            if (res.ok) {
                // Feedback visual
                btnUpdate.classList.replace('bg-indigo-600', 'bg-green-500');
                btnUpdate.innerText = '¡Actualizado!';

                // Actualizar la lista desplegable para reflejar los nuevos montos
                await fetchSaldos(verCuenta.value);

                setTimeout(() => {
                    btnUpdate.classList.replace('bg-green-500', 'bg-indigo-600');
                    btnUpdate.innerText = originalText;
                }, 2000);
            } else {
                btnUpdate.classList.add('bg-red-500');
                setTimeout(() => btnUpdate.classList.remove('bg-red-500'), 2000);
            }
        } catch (e) { console.error(e); }
    });
}); // Cierre correcto del DOMContentLoaded
</script>

{% endblock %}
